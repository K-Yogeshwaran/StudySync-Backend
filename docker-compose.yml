
services:
  mysql-db:
    image: mysql:latest
    container_name: studysync_mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: studysync
      MYSQL_USER: studysync
      MYSQL_PASSWORD: user123
    ports:
      - "3306:3306"
    volumes:
      - studysync-mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

  studysync-backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: studysync_backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/studysync
      DB_USERNAME: studysync
      DB_PASSWORD: user123

      DDL_AUTO: update
      SHOW_SQL: "true"
      SERVER_PORT: 8080

    depends_on:
      mysql-db:
        condition: service_healthy

    


volumes:
  studysync-mysql-data: