name : Backend CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name : checkout source code
        uses : actions/checkout@v5

      - name : setup java 21
        uses : actions/setup-java@v5
        with :
          java-version : "21"
          distribution : "temurin"
          cache : maven

      - name : Build and test
        run : ./mvnw clean verify

      - name : Login to Github Container Registry
        uses : docker/login-action@v3
        with :
          registry : ghcr.io
          username : ${{github.actor}}
          password : ${{secrets.GITHUB_TOKEN}}


      - name : Build docker image
        run : |
              IMAGE_NAME=$(echo "ghcr.io/${{github.repository}}" | tr '[:upper:]' '[:lower:]' )
              docker build \
                -t $IMAGE_NAME:${{github.sha}} \
                -t $IMAGE_NAME:latest \
                .
      - name : Push the docker image to the registry
        run : |
              REPOSITORY_NAME=$(echo "${{github.repository}}" | tr '[:upper:]' '[:lower:]')
              docker push ghcr.io/$REPOSITORY_NAME:${{github.sha}} 
              docker push ghcr.io/$REPOSITORY_NAME:latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{secrets.AWS_DEPLOY_ROLE_ARN}}
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Test EC2 connection
        run: |
          aws ssm send-command \
            --instance-ids "i-0d81657c05a705db7" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["echo StudySync automated deployment connection works"]' \
            --comment "StudySync CD connection test"