name : Backend CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name : checkout source code
        uses : actions/checkout@v5

      - name : setup java 21
        uses : actions/setup-java@v5
        with :
          java-version : "21"
          distribution : "temurin"
          cache : maven

      - name : Build and test
        run : ./mvnw clean verify

      - name : Login to Github Container Registry
        uses : docker/login-action@v3
        with :
          registry : ghcr.io
          username : ${{github.actor}}
          password : ${{secrets.GITHUB_TOKEN}}


      - name : Build docker image
        run : |
              IMAGE_NAME=$(echo "ghcr.io/${{github.repository}}" | tr '[:upper:]' '[:lower:]' )
              docker build \
                -t $IMAGE_NAME:${{github.sha}} \
                -t $IMAGE_NAME:latest \
                .
      - name : Push the docker image to the registry
        run : |
              REPOSITORY_NAME=$(echo "${{github.repository}}" | tr '[:upper:]' '[:lower:]')
              docker push ghcr.io/$REPOSITORY_NAME:${{github.sha}} 
              docker push ghcr.io/$REPOSITORY_NAME:latest

      - name: Inspect OIDC claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "Failed to obtain OIDC token"
            exit 1
          fi

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          # Convert Base64URL → Base64
          PAYLOAD=$(echo "$PAYLOAD" | tr '_-' '/+')

          # Add required padding
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" | base64 -d | jq '{
            iss,
            sub,
            aud,
            repository,
            repository_id,
            repository_owner,
            repository_owner_id,
            ref,
            ref_type
          }'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{secrets.AWS_DEPLOY_ROLE_ARN}}
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity